# Builds the live demos and deploys them to GitHub Pages, at
# https://ai-atlaas.github.io/pixel-foundry/. The GitBook "Pixel Foundry demo"
# block embeds them from there, so the docs update without publishing the
# GitBook integration again.
#
# Runs after each npm publish (called by publish.yml), when the demos change
# on main, or by hand from the Actions tab. The demos always use the package
# version in the root package.json, as published on npm.

name: Deploy demos

on:
  push:
    branches: [main]
    paths:
      - gitbook-integration/frame/**
      - gitbook-integration/scripts/build-pages.mjs
      - gitbook-integration/package.json
      - gitbook-integration/package-lock.json
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitbook-integration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Right after a publish, npm can take a minute or two to serve the new
      # version, so keep trying for about five minutes.
      - name: Install the released package version
        run: |
          version="$(node -p "require('../package.json').version")"
          for attempt in $(seq 1 20); do
            if npm install --no-save --ignore-scripts "@ai-atlaas/pixel-foundry@$version"; then
              exit 0
            fi
            echo "Waiting for @ai-atlaas/pixel-foundry@$version on npm (attempt $attempt)"
            sleep 15
          done
          echo "::error::@ai-atlaas/pixel-foundry@$version isn't on npm. Publish it first, then run Deploy demos again."
          exit 1

      - name: Build the demos
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: gitbook-integration/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
