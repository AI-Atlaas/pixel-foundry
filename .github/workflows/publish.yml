# Publishes @ai-atlaas/pixel-foundry to npm.
#
# Runs in two cases:
# - A version bump reaches main, normally by merging the "Release <version>"
#   pull request that the "Prepare release" workflow opens. If the version has
#   no v<version> tag yet, this publishes it, then tags the commit and creates
#   the GitHub Release with the notes from the changelog.
# - A GitHub Release is published by hand. This publishes the release's tag.
#
# Publishing waits for approval in the "production" environment.
#
# Authentication uses npm trusted publishing (OIDC): no npm token is stored in
# GitHub. The package's trusted publisher on npmjs.com must name this file,
# "publish.yml", in the AI-Atlaas/pixel-foundry repository, with the
# "production" environment used by the publish job below.

name: Publish to npm

on:
  push:
    branches: [main]
    paths: [package.json]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  # On a push to main: is package.json at a version that hasn't been released?
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Look for an existing release tag
        id: check
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: ${{ !cancelled() && (github.event_name == 'release' || needs.check.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow through OIDC
    # Must match the environment in the npm trusted publisher settings.
    environment:
      name: production
      url: https://www.npmjs.com/package/@ai-atlaas/pixel-foundry
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install --global npm@^11.5.1

      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Check the changelog has notes for this version
        run: node scripts/release-notes.mjs "$(node -p "require('./package.json').version")" > /dev/null

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs the typecheck, build and tests before uploading.
      - name: Publish
        run: npm publish

  # After a push-triggered publish: tag the commit and create the GitHub Release.
  # A release created here doesn't start this workflow again, so it isn't
  # published twice.
  release:
    needs: [check, publish]
    if: github.event_name == 'push' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag the commit and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
